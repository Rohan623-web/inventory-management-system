services:

  db:
    image: postgres:16

    container_name: inventory_postgres

    restart: always

    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: inventory_backend

    restart: always

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: inventory_frontend

    restart: always

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  postgres_data: